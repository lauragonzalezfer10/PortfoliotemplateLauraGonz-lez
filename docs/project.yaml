  es: Plantilla de Portfolio Creativo
  en: Creative Portfolio Template

abstract:
  es: |
    Este proyecto consiste en desarrollar una plantilla de portfolio responsive y accesible dirigida a creativos como diseñadores o artistas. El objetivo es crear una base personalizable para que los usuarios puedan adecuarla a sus gustos y estilo para mostrar sus trabajos de una forma sencilla y estética.
  en: |
    This project consists of developing a responsive and accessible portfolio template aimed at creatives such as designers or artists. The goal is to create a customisable foundation that users can adapt to their own tastes and style in order to showcase their work in a simple and visually appealing way.

