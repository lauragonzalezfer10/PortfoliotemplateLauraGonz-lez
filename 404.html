<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 – Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/404.css" />
  </head>

  <body class="bg-secondary text-light overflow-hidden">
    <!-- Drawing layer -->
    <div id="draw-layer" aria-hidden="true">
      <svg id="draw-svg" preserveAspectRatio="none"></svg>
    </div>

    <main
      class="min-vh-100 d-flex align-items-center justify-content-center text-center position-relative z-2"
    >
      <div class="container">
        <h1 class="display-1 fw-bold mb-2">404</h1>

        <!-- Title -->
        <h2 class="mb-3 display-1 fw-bold">Lost, but not broken</h2>

        <!-- Body text -->
        <p class="lead mb-3 body-text display-7">
          Looks like this page wandered off the map. <br />That’s okay —
          mistakes make good stories. <br />Grab a moment, draw something, or
          head back home when you’re ready.
        </p>

        <a
          href="/"
          class="btn btn-outline-light btn-lg rounded-pill px-4 btn-outline-fill"
        >
          Back to Home
        </a>

        <p class="mt-4 small font-monospace">
          Draw on the background ✍️ — because even errors deserve a little
          creativity
          <br />
          <span class="opacity-75">(Press <strong>C</strong> to clear)</span>
        </p>
      </div>
    </main>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="./assets/js/404.js"></script>
  </body>
</html>
